[[redirects]]
  from = "https://www.thecreativehorse.ca/*"
  to = "https://thecreativehorse.ca/:splat"
  status = 301
  force = true
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

# Next.js specific settings
[functions]
  node_bundler = "esbuild"

